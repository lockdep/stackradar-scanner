stackradar:
  # -- StackRadar API endpoint. Override only when running against a self-hosted instance.
  apiUrl: "https://api.stackradar.io"

  # -- Cluster ID to identify this cluster in StackRadar. Can be passed inline at install time
  # instead of via a Secret (avoid in day-to-day use — values land on disk and in CI logs).
  clusterId: ""

  # -- API key for StackRadar. If set, the chart creates the credentials Secret automatically.
  apiKey: ""

  # -- Name of a pre-existing Secret with keys `cluster-id` and `api-key`.
  # When set, the chart skips Secret creation and the Deployment reads from this Secret instead.
  # Compatible with sealed-secrets, external-secrets, and SOPS workflows.
  existingSecret: ""

  # -- Key within `existingSecret` holding the API key. Defaults to `api-key` when empty.
  existingSecretKeyApiKey: ""

  # -- Key within `existingSecret` holding the cluster ID. Defaults to `cluster-id` when empty.
  existingSecretKeyClusterId: ""

scanner:
  # -- Comma-separated list of namespaces to exclude from scanning.
  excludeNamespaces: "kube-system,kube-public,kube-node-lease"

  # -- Comma-separated list of namespaces to scan. When set, ONLY these namespaces are scanned.
  includeNamespaces: ""

  # -- Comma-separated glob patterns for images that are never scanned, whatever
  # namespace they run in. Matched against the image name with its tag and digest
  # stripped, so a pattern written once keeps working as the tag moves. `*` is the
  # only wildcard and it spans `/`; everything else is literal, and patterns match
  # the whole name — `registry.k8s.io/*` covers `registry.k8s.io/pause:3.9` but not
  # `myregistry.io/registry.k8s.io-mirror/app`. A pattern that carries a `:tag` or
  # an `@sha256:...` could never match, so it is dropped with a warning at startup
  # rather than silently doing nothing. The agent logs the patterns it ended up
  # with when it starts — worth reading, since an over-broad one drops coverage
  # quietly. Example: "registry.k8s.io/*,*/pause,ghcr.io/acme/vendor-*"
  excludeImages: ""

  # -- Timeout per image scan in milliseconds.
  syftTimeoutMs: "300000"

  # -- Skip images whose digest is already indexed in StackRadar.
  # Eliminates redundant syft runs when the image binary has not changed.
  skipExistingDigests: "true"

  # -- Resolve imagePullSecrets from workload pod specs for private registry auth.
  # Requires `secrets get` permission in the ClusterRole, which
  # `scanner.imagePullSecretNames` narrows to a named set of Secrets.
  resolveImagePullSecrets: "true"

  # -- Names of the imagePullSecrets the scanner is allowed to read. When empty,
  # the ClusterRole grants `secrets get` cluster-wide. Naming your pull secrets
  # here narrows the grant to those names via RBAC `resourceNames` — the
  # recommended setting. Names match in every namespace: a Secret called
  # `regcred` anywhere in the cluster is readable, so use distinct names if that
  # matters to you. A Secret left off the list is not readable, and images that
  # need it fall back to an anonymous pull — the agent logs a warning naming the
  # Secret. Only used when `scanner.resolveImagePullSecrets` is "true".
  imagePullSecretNames: []

watcher:
  # -- Enable the event-driven watcher with periodic sweeps.
  enabled: true

  # -- How often to run a full pod sweep in milliseconds.
  # Set to 0 to disable periodic sweeps and rely solely on the informer.
  sweepIntervalMs: "21600000"

  # -- Maximum number of concurrent syft scans.
  # Each invocation can use 300–600 MiB for large images; keeping this at 1 avoids OOM kills.
  concurrentScans: "1"

  # -- Port for the agent's liveness and readiness endpoints. Not exposed by a
  # Service — the kubelet reaches it on the pod IP and nothing else does. Change
  # it only if something else in the pod's network namespace already listens
  # here. Must be 1024 or above: the container drops every Linux capability, so
  # it cannot bind a privileged port.
  healthPort: "8081"

  # -- Resource requests and limits for the watcher Deployment.
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi

proxy:
  # -- HTTP proxy URL for outbound traffic, e.g. `http://proxy.corp:8080`. Include the
  # scheme — a bare `proxy.corp:8080` is rejected, because tools that read these
  # variables disagree about what a scheme-less value means.
  httpProxy: ""

  # -- HTTPS proxy URL for outbound traffic. Set this one if you set only one:
  # the StackRadar API and most registries are reached over https.
  httpsProxy: ""

  # -- Comma-separated hosts that bypass the proxy. The in-cluster Kubernetes API
  # (`kubernetes.default.svc`, `.svc`, `.cluster.local`, `localhost`, `127.0.0.1`)
  # is always appended, so list only your own internal registries here.
  noProxy: ""

caBundle:
  # -- Name of a ConfigMap holding additional CA certificates to trust, for clusters
  # behind a TLS-intercepting proxy. The object must hold a PEM bundle under
  # `caBundle.key`; it is mounted read-only and added to the trust store of both
  # runtimes in the image. Mutually exclusive with `caBundle.secretName` — setting
  # both fails the render rather than silently picking one.
  configMapName: ""

  # -- Name of a Secret holding the same thing, for workflows that keep the bundle in
  # a Secret. A CA certificate is public by nature, so a ConfigMap is the usual home;
  # this exists because external-secrets and SOPS pipelines deliver everything as
  # Secrets.
  secretName: ""

  # -- Key within the ConfigMap or Secret holding the PEM bundle. Only this one key is
  # mounted, so unrelated keys in the same object are not exposed to the pod.
  key: "ca-certificates.crt"

networkPolicy:
  # -- Create a NetworkPolicy for the scanner pod. Ingress is denied except the
  # health port the kubelet probes on; egress is allowed to the destinations in
  # `networkPolicy.egress`. Requires a CNI that enforces NetworkPolicy — with
  # one that does not, the object is inert rather than a false sense of safety,
  # so confirm yours enforces policy before treating this as a control.
  enabled: false

  # -- Egress rules, written in the API's own `spec.egress` shape. Left empty,
  # the chart renders defaults covering DNS, the Kubernetes API server, and TCP
  # 443 to any address — the StackRadar API and your registries. A list set here
  # replaces those defaults entirely rather than adding to them: narrow the 443
  # rule to the CIDRs your registries live in if you know them, and keep a DNS
  # rule of your own or nothing resolves. Behind a proxy this collapses to DNS
  # plus the proxy's address, which is a far tighter policy than the default.
  egress: []

# -- Name of a `kubernetes.io/dockerconfigjson` Secret to mount as a docker config,
# allowing syft to pull from private registries.
# Create with: `kubectl create secret generic registry-credentials --from-file=.dockerconfigjson=...`
dockerConfigSecret: ""

image:
  # -- Container image repository.
  repository: ghcr.io/lockdep/stackradar-scanner

  # -- Image tag. Defaults to the chart appVersion, which for a released chart is the
  # release version — leave empty so the chart and the image it deploys stay in lockstep.
  tag: ""

  # -- Image digest (sha256:...). Stamped by the release workflow so every published chart
  # pins the exact image bytes it was tested against, and set empty on dev builds.
  # The digest wins over the tag: to run a different image you must clear this as well
  # (`--set image.tag=X --set image.digest=""`), otherwise the tag is cosmetic.
  digest: ""

  # -- Image pull policy.
  pullPolicy: Always

# -- List of image pull secrets for the scanner pod.
imagePullSecrets: []

# -- Extra labels for the scanner pod. Azure Workload Identity is switched on
# here, with `azure.workload.identity/use: "true"`. The chart's own labels win
# on a collision: `app.kubernetes.io/name`, `app.kubernetes.io/instance` and
# `app.kubernetes.io/component` are part of the Deployment's selector and are
# immutable after creation, so a value that displaced one would break the next
# `helm upgrade` rather than this install.
podLabels: {}

# -- Extra annotations for the scanner pod, e.g. the client ID Azure Workload
# Identity reads (`azure.workload.identity/client-id`).
podAnnotations: {}

# -- Pod-level security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

# -- Container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Node selector for pod scheduling.
nodeSelector: {}

# -- Tolerations for pod scheduling on tainted nodes.
tolerations: []

# -- Affinity rules for fine-grained pod placement.
affinity: {}

# -- PriorityClassName so the scanner yields resources to application pods.
priorityClassName: ""

# -- Override the chart name used in resource names and labels.
nameOverride: ""

# -- Override the full name of the chart's resources, replacing the
# `<release>-<chart>` default entirely.
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount for the scanner.
  create: true

  # -- Override the ServiceAccount name. Defaults to the release name when empty.
  name: ""

  # -- Annotations for the ServiceAccount. This is where cloud workload identity
  # is wired up — `eks.amazonaws.com/role-arn` on EKS,
  # `iam.gke.io/gcp-service-account` on GKE — so the pod receives short-lived
  # credentials from the cloud instead of a static `dockerConfigSecret`. Only
  # meaningful with `serviceAccount.create: true`; setting both fails the render
  # rather than putting the annotations nowhere.
  annotations: {}
