{{- /*
Chart-managed Secret is only rendered when ALL of these are true:
  - the user has NOT set `stackradar.existingSecret` (pointing at a Secret they manage themselves),
  - AND the user has provided inline credentials via `stackradar.apiKey` at install time.

The common onboarding flow is `helm install` first (no credentials), then
`kubectl create secret generic <release>-scanner …` afterwards. In that case
nothing is rendered here and the Deployment will wait for the user-created
Secret to appear before the Pod becomes Ready.
*/ -}}
{{- if and (not .Values.stackradar.existingSecret) .Values.stackradar.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stackradar-scanner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stackradar-scanner.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.stackradar.apiKey | quote }}
  cluster-id: {{ required "stackradar.clusterId is required when providing stackradar.apiKey inline" .Values.stackradar.clusterId | quote }}
{{- end }}
