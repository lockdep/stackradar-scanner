{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "stackradar-scanner.fullname" . }}
  labels:
    {{- include "stackradar-scanner.labels" . | nindent 4 }}
rules:
  # List and watch pods — list for the batch scanner, watch for the watcher Deployment
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  # Read workload resources to discover all configured images
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list"]
  {{- if eq (.Values.scanner.resolveImagePullSecrets | toString) "true" }}
  # Read imagePullSecrets to resolve private registry credentials per workload
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "stackradar-scanner.fullname" . }}
  labels:
    {{- include "stackradar-scanner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "stackradar-scanner.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "stackradar-scanner.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
