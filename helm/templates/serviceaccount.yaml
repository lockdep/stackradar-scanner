{{- /*
Annotations on a ServiceAccount the chart does not own land nowhere: the chart
renders one object or none, and it never patches an existing one. Since
`serviceAccount.annotations` is how workload identity is switched on, silently
dropping it means a pod with no cloud credentials and nothing in the render to
explain why. Guard before the `if`, so it fires in the case it is about.
*/ -}}
{{- if and .Values.serviceAccount.annotations (not .Values.serviceAccount.create) }}
{{- fail (printf "serviceAccount.annotations is set but serviceAccount.create is false, so the chart renders no ServiceAccount for them to land on. Either set serviceAccount.create=true, or annotate %q yourself — the chart will not touch a ServiceAccount it did not create." (include "stackradar-scanner.serviceAccountName" .)) }}
{{- end }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stackradar-scanner.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stackradar-scanner.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
