apiVersion: v2
name: stackradar-scanner
description: >-
  Event-driven Kubernetes scanner that watches pod changes in real time,
  generates SBOMs with Syft, and uploads them to StackRadar for continuous
  software supply-chain visibility.
type: application

# Placeholder. The released version is stamped in by CI from the git tag that
# triggered the release (`v1.2.3` -> `1.2.3`), so there is nothing to bump by
# hand here. A chart built off this file without CI is a dev build by
# construction — never publish it.
version: 0.0.0-dev
appVersion: "0.0.0-dev"

home: https://stackradar.io
sources:
  - https://github.com/lockdep/stackradar-scanner

keywords:
  - sbom
  - security
  - supply-chain
  - scanner
  - syft
  - kubernetes

maintainers:
  - name: StackRadar
    email: support@stackradar.io
    url: https://stackradar.io

icon: https://stackradar.io/icon.png

# `artifacthub.io/changes` and the image reference under `artifacthub.io/images`
# are rewritten by the release workflow from the tag's commit range and the
# built image digest. The values below are dev placeholders.
annotations:
  artifacthub.io/category: security
  # Source-available, not open source: use is permitted except to build or run
  # something that competes with StackRadar. Full terms ship in the chart as
  # LICENSE.md, as the license's Notices section requires.
  artifacthub.io/license: PolyForm-Shield-1.0.0
  artifacthub.io/changes: |
    - kind: added
      description: Development build
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.stackradar.io
    - name: Support
      url: https://github.com/lockdep/stackradar-scanner/issues
    - name: License
      url: https://github.com/lockdep/stackradar-scanner/blob/main/LICENSE.md
  artifacthub.io/images: |
    - name: stackradar-scanner
      image: ghcr.io/lockdep/stackradar-scanner:0.0.0-dev
      whitelisted: true
