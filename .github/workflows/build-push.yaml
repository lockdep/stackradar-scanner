name: Build and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/lockdep/stackradar-scanner
  CHART_REPO: ghcr.io/lockdep/charts
  CHART_NAME: stackradar-scanner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # Cosign keyless signing via GitHub Actions OIDC
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=build-${{ github.run_number }},enable={{is_default_branch}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      # Keyless signing — no key management needed.
      # Verify with:
      #   cosign verify \
      #     --certificate-identity-regexp "https://github.com/lockdep/stackradar-scanner/.github/workflows/build-push.yaml" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      #     ghcr.io/lockdep/stackradar-scanner@<digest>
      - name: Sign image with Cosign (keyless)
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

  publish-chart:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write  # Cosign keyless signing via GitHub Actions OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin image digest in chart values
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: yq -i '.image.digest = strenv(DIGEST)' helm/values.yaml

      - name: Package and push Helm chart
        id: chart
        run: |
          set -euo pipefail
          helm package helm/
          pkg=$(ls ${{ env.CHART_NAME }}-*.tgz)
          # helm push reports "Pushed:" and "Digest:" on stderr
          helm push "${pkg}" oci://${{ env.CHART_REPO }} 2>&1 | tee push.log
          digest=$(awk '/^Digest: /{print $2}' push.log)
          if [ -z "${digest}" ]; then
            echo "::error::could not parse chart digest from helm push output"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing — same OIDC identity as the container image, so the
      # chart and the image it deploys share one provenance chain.
      # Verify with:
      #   cosign verify \
      #     --certificate-identity-regexp "https://github.com/lockdep/stackradar-scanner/.github/workflows/build-push.yaml" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      #     ghcr.io/lockdep/charts/stackradar-scanner@<digest>
      - name: Sign chart with Cosign (keyless)
        run: |
          cosign sign --yes \
            ${{ env.CHART_REPO }}/${{ env.CHART_NAME }}@${{ steps.chart.outputs.digest }}

  update-manifests:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout gitops repository
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: stackradar-gitops

      - name: Update scanner image tag and digest
        env:
          BUILD_TAG: build-${{ github.run_number }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          yq -i '.image.tag = strenv(BUILD_TAG) | .image.digest = strenv(DIGEST)' \
            stackradar-gitops/argocd/scanner-values.yaml

      - name: Commit and push to gitops repo
        run: |
          cd stackradar-gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add argocd/scanner-values.yaml
          git diff --staged --quiet || git commit -m "ci: update scanner to build-${{ github.run_number }}"
          git push
